<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: "system-ui";
            font-size: 16px;
            font-weight: bold;
        }

        #header{
            display: flex;
            box-shadow: 0 6px 6px rgb(102, 98, 98, 0.5);
            padding-bottom: 10px;
            background-color: #e8ecbe;

            button{
                display: none;
                box-shadow: 0 6px 6px rgb(102, 98, 98, 0.5);

                @media screen and (width<960px) {
                    display: block;
                    margin: 10px 10px 10px auto;
                }
            }

            .menu{
                margin: 5px 10px 5px auto;
                gap:10px;
                
                @media screen and (width<960px){
                    display: none;
                }
            }
        }


    </style>
</head>

<body>
    <header id="header">
        <div class="logo">
            <a href="#"> Logo
                <img src="" alt="logo">
            </a>
        </div>
        <button>&#9776</button>
        <nav class="menu">
            <a href="">Home</a>
            <a href="">Equipo</a>
            <a href="">Contacto</a>
        </nav>

    </header>
</body>

</html>
